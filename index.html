<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call It</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="game.css">
</head>
<body>
<header>
  <span class="money">$<span id="money">0</span></span>
  <span class="rate" id="rate"></span>
</header>

<main>
  <section id="tab-flip" class="tab active">
    <div class="stats">
      <div class="chip"><span>Momentum</span><b id="mom">×1.00</b></div>
      <div class="chip"><span>Potential</span><b id="pot">×1.00</b></div>
    </div>

    <div class="coin-wrap">
      <div id="pop" class="pop"></div>
      <div id="coin" class="coin">
        <div class="face h">H</div>
        <div class="face t">T</div>
      </div>
    </div>

    <div class="calls">
      <button id="callH" class="call h">H</button>
      <button id="callT" class="call t">T</button>
    </div>

    <div id="strip" class="strip"></div>
    <p id="msg" class="msg"></p>
  </section>

  <section id="tab-shop" class="tab">
    <div id="shop"></div>
  </section>

  <section id="tab-more" class="tab">
    <h2>Stats</h2>
    <div class="grid" id="statGrid"></div>
    <h2>Links</h2>
    <p><a href="sim/">Streak simulator</a></p>
    <h2>Save</h2>
    <div class="row"><button id="reset" class="danger">Reset</button></div>
  </section>
</main>

<nav>
  <button data-tab="flip" class="on"><i class="ti ti-coin"></i><span>Call</span></button>
  <button data-tab="shop"><i class="ti ti-arrow-big-up-lines"></i><span>Upgrades</span><i class="dot" id="shopDot"></i></button>
  <button data-tab="more"><i class="ti ti-dots"></i><span>More</span></button>
</nav>

<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
